<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Report — Sentry Sweep</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/pages.css">
</head>
<body>

<script src="js/shell.js"></script>
<script src="js/ui-helpers.js"></script>
<script>Shell.render("report", "Report");</script>

<script>
function loadHistory() {
  try { return JSON.parse(localStorage.getItem("sentrysweep_history") || "[]"); }
  catch (e) { return []; }
}

const params = new URLSearchParams(location.search);
const idx = params.has("i") ? parseInt(params.get("i"), 10) : 0;
const history = loadHistory();
const result = history[idx];

const content = document.getElementById("content");

if (!result) {
  content.innerHTML = `
    <div class="empty" style="padding-top:80px;">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M6 2h9l5 5v15H6z"/><path d="M14 2v6h6"/></svg>
      <div class="empty__title">No report available</div>
      <div class="empty__body">Run a scan first — the report generates automatically from your latest scan results.</div>
      <a class="btn btn--primary" style="margin-top:18px;" href="scan.html">Run a scan</a>
    </div>`;
} else {
  renderReport(result);
}

function ratingColor(rating) {
  if (rating === "Critical Risk") return "var(--critical)";
  if (rating === "High Risk") return "var(--high)";
  if (rating === "Moderate Risk") return "var(--medium)";
  if (rating === "Fair") return "var(--medium)";
  return "var(--low)";
}

function scoreRing(score, color) {
  const r = 40, c = 2 * Math.PI * r;
  const offset = c - (score / 100) * c;
  return `<svg class="riskscore__ring" viewBox="0 0 100 100">
    <circle cx="50" cy="50" r="${r}" fill="none" stroke="var(--border)" stroke-width="8"/>
    <circle cx="50" cy="50" r="${r}" fill="none" stroke="${color}" stroke-width="8"
      stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${offset}"
      transform="rotate(-90 50 50)"/>
    <text x="50" y="46" text-anchor="middle" fill="var(--text)" font-size="22" font-family="Space Grotesk, sans-serif" font-weight="600">${score}</text>
    <text x="50" y="63" text-anchor="middle" fill="var(--text-dim)" font-size="9" font-family="IBM Plex Mono, monospace">/ 100</text>
  </svg>`;
}

function renderReport(r) {
  const color = ratingColor(r.overallRating);

  content.innerHTML = `
    <div class="report-head">
      <div>
        <h1 style="font-size:22px; margin-bottom:4px;">Vulnerability Assessment Report</h1>
        <p style="max-width:480px;">Automated scan summary for <span class="mono" style="color:var(--text);">${UIHelpers.escapeHtml(r.target)}</span>. Generated by Sentry Sweep's detection engine.</p>
        <div class="report-meta">
          <div><span>TARGET</span><b>${UIHelpers.escapeHtml(r.target)}</b></div>
          <div><span>SCAN DATE</span><b>${UIHelpers.fmtDate(r.generatedAt)}</b></div>
          <div><span>OVERALL RATING</span><b style="color:${color};">${r.overallRating}</b></div>
        </div>
      </div>
      <div class="card riskscore" style="padding:18px 26px;">
        ${scoreRing(r.riskScore, color)}
        <div class="riskscore__label">SECURITY SCORE</div>
      </div>
    </div>

    <div class="no-print" style="display:flex; gap:10px; margin-bottom:26px;">
      <button class="btn btn--primary" onclick="window.print()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9V2h12v7"/><path d="M6 18H4a2 2 0 01-2-2v-5a2 2 0 012-2h16a2 2 0 012 2v5a2 2 0 01-2 2h-2"/><path d="M6 14h12v8H6z"/></svg>
        Export / Print report
      </button>
      <a class="btn" href="scan.html">Run another scan</a>
    </div>

    <div class="statgrid">
      <div class="stat"><div class="stat__num">${r.hosts.length}</div><div class="stat__label">ACTIVE HOSTS</div></div>
      <div class="stat"><div class="stat__num">${r.totalOpenPorts}</div><div class="stat__label">OPEN PORTS</div></div>
      <div class="stat stat--critical"><div class="stat__num">${r.counts.critical}</div><div class="stat__label">CRITICAL</div></div>
      <div class="stat stat--high"><div class="stat__num">${r.counts.high}</div><div class="stat__label">HIGH</div></div>
    </div>

    <hr class="divider">

    <h2 style="font-size:16px; margin-bottom:14px;">Active hosts & services</h2>
    <div class="card" style="margin-bottom:28px;">
      <table>
        <thead><tr><th>Host</th><th>Open ports</th><th>Services</th><th>Findings</th></tr></thead>
        <tbody>
          ${r.hosts.map(h => `
            <tr>
              <td class="mono emph">${h.ip}<br><span style="color:var(--text-dim); font-size:11.5px;">${h.hostname}</span></td>
              <td>${h.openPorts.length}</td>
              <td class="mono">${h.openPorts.map(p => p.port).join(", ") || "—"}</td>
              <td>${h.vulnerabilities.length ? UIHelpers.severityBadge(h.vulnerabilities[0].severity) + " " + h.vulnerabilities.length : '<span class="badge badge--low">0</span>'}</td>
            </tr>`).join("")}
        </tbody>
      </table>
    </div>

    <h2 style="font-size:16px; margin-bottom:14px;">Detected vulnerabilities</h2>
    ${r.findings.length === 0 ? `
      <div class="card"><div class="empty">
        <div class="empty__title">No vulnerabilities detected</div>
        <div class="empty__body">This scan didn't surface any of the checked issues. Re-run periodically as configurations change.</div>
      </div></div>` :
      r.findings.map(f => `
      <div class="vuln-item">
        <div class="vuln-item__head">
          ${UIHelpers.severityBadge(f.severity)}
          <span class="vuln-item__title">${f.title}</span>
          <span class="vuln-item__loc">${f.host}:${f.port} · ${f.protocol}</span>
        </div>
        <div class="vuln-item__body">
          <div class="vuln-item__col">
            <h4>SECURITY IMPACT</h4>
            <p>${f.impact}</p>
          </div>
          <div class="vuln-item__col">
            <h4>RECOMMENDED MITIGATION</h4>
            <p>${f.recommendation}</p>
          </div>
        </div>
      </div>`).join("")
    }

    <p class="print-only" style="margin-top:30px; font-size:11px; color:#888;">Generated by Sentry Sweep — Network Vulnerability Detection & Analysis System · ${UIHelpers.fmtDate(r.generatedAt)}</p>
  `;
}
</script>
</body>
</html>
